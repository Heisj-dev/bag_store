{% if seo.trail %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
        {% for name, url in seo.trail %}
            {% if url %}
                <li><a href="{{ url }}">{{ name }}</a></li>
            {% else %}
                <li aria-current="page">{{ name }}</li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
{% endif %}
