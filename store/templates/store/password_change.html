{% extends "store/base.html" %}

{% block title %}Change Password — Bags &amp; Beyond{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">

        <p class="eyebrow">Bags &amp; Beyond</p>

        <h1>Change<br>password.</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change password
            </button>

        </form>

        <div class="auth-links">
            <p>
                <a href="{% url 'account' %}">Back to my account</a>
            </p>
        </div>

    </div>
</section>

{% endblock %}
